name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit & integration tests
        run: pytest -v

      - name: Verify CLI commands
        run: |
          social-ode equilibrium
          social-ode convergence --t-end 50
          social-ode calibrate --n-obs 30
          social-ode policies

      - name: Validate Jupyter notebook schema & outputs
        run: |
          python -c "
          import nbformat
          nb = nbformat.read('notebooks/social_network_ode_model.ipynb', as_version=4)
          nbformat.validate(nb)
          code_cells = [c for c in nb.cells if c.cell_type == 'code']
          assert len(code_cells) >= 8, 'Expected code cells in notebook'
          assert all(c.get('outputs') for c in code_cells), 'All code cells must contain executed outputs'
          print(f'Validated {len(nb.cells)} cells ({len(code_cells)} executed code cells).')
          "
