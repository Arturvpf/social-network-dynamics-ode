[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-network-ode"
version = "1.0.0"
description = "Nonlinear ODE modeling, stability analysis, numerical solver benchmarks, and recommendation policy simulation for social network user dynamics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Andreywid Yago Lima de Souza", email = "ayls@cin.ufpe.br" },
    { name = "Artur Vinicius Pereira Fernandes", email = "arturvpf3@gmail.com" },
    { name = "Breno Ramos de Souza Gomes", email = "brsg@cin.ufpe.br" },
    { name = "Valter Sanches Martins Neto", email = "vsmn@cin.ufpe.br" },
    { name = "Manoel Lira de Carvalho", email = "mlc6@cin.ufpe.br" },
]
keywords = [
    "ordinary-differential-equations",
    "dynamical-systems",
    "social-networks",
    "recommender-systems",
    "numerical-methods",
    "bifurcation-analysis",
    "routh-hurwitz",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbclient>=0.8",
]

[project.scripts]
social-ode = "social_network_ode.cli:main"

[project.urls]
Repository = "https://github.com/Arturvpf/social-network-dynamics-ode"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
